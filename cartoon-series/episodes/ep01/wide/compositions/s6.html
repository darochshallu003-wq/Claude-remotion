      };
      // on: the night light sputters and dies. off: the power comes back (door still shut: night tint).
      R.blackout = (t, on) => {
        const els = dimmable();
        const seq = on ? [DIM, LIT, DIM, LIT, DIM] : [LIT, DIM, LIT, DIM, LIT];
        const at = [0, 0.09, 0.2, 0.32, 0.5];
        seq.forEach((f, i) => tl.set(els, { filter: f }, t + at[i]));
        if (on) tl.set($("dark"), { opacity: 0 }, t);
        else tl.to($("dark"), { opacity: 0.45, duration: 0.3 }, t + 0.5);
      };
    
      // ---------- the torch ----------
      // Where a character's hand is (world units) with that arm raised `raise` degrees.
      R.handPos = (who, side, raise) => {
        const a = $(who + "-arm" + side), h = a.querySelector("circle");
        const sx = +a.dataset.sx, sy = +a.dataset.sy;
        const vx = +h.getAttribute("cx") - sx, vy = +h.getAttribute("cy") - sy;
        const th = ((side === "L" ? raise : -raise) * Math.PI) / 180;
        const p = R.pos[who][R.pos[who].length - 1];
        const sc = p.s;
        return [p.x + sc * (sx + vx * Math.cos(th) - vy * Math.sin(th)), p.y + sc * (sy + vx * Math.sin(th) + vy * Math.cos(th))];
      };
      // Point the torch from grip (gx, gy) at (tx, ty) with a spot of radius r.
      R.aim = (t, gx, gy, tx, ty, r = 150, dur = 0, ease = "power2.inOut") => {
        const ang = Math.atan2(ty - gy, tx - gx);
        const lx = gx + 74 * Math.cos(ang), ly = gy + 74 * Math.sin(ang);
        const px = -Math.sin(ang) * r * 0.8, py = Math.cos(ang) * r * 0.8;
        const pts = `${lx},${ly} ${tx + px},${ty + py} ${tx - px},${ty - py}`;
        const deg = (ang * 180) / Math.PI;
        const go = (el, v) => (dur <= 0 ? tl.set(el, v, t) : tl.to(el, { ...v, duration: dur, ease }, t));
        go($("torch"), { x: gx, y: gy, rotation: deg, svgOrigin: "0 0" });
        go($("spot"), { attr: { cx: tx, cy: ty, r } });
        go($("cone"), { attr: { points: pts } });
      };
      R.beamOn = (t, on) => tl.set($("beam"), { opacity: on ? 1 : 0 }, t);
      R.torchOn = (t, show) => tl.set($("torch"), { opacity: show ? 1 : 0 }, t);
    
      // ---------- getting around ----------
      // A waddle: little hops, a sway, feet on the shelf at every step.
      R.walk = (who, t, x, dur = 0.8, hop = 16) => {
        const p = posAt(who, t), el = $(who), br = $(who + "-br");
        const n = Math.max(2, Math.round(dur / 0.16)), st = dur / n;
        tl.to(el, { x, duration: dur, ease: "power1.inOut" }, t);
        for (let k = 0; k < n; k++) {
          tl.to(el, { y: p.y - hop, duration: st / 2, ease: "sine.out" }, t + k * st);
          tl.to(el, { y: p.y, duration: st / 2, ease: "sine.in" }, t + k * st + st / 2);
        }
        tl.fromTo(br, { rotation: -5, svgOrigin: "0 0" }, { rotation: 5, duration: st, ease: "sine.inOut", yoyo: true, repeat: n - 1, svgOrigin: "0 0" }, t);
        tl.to(br, { rotation: 0, duration: 0.15, svgOrigin: "0 0" }, t + dur);
        R.pos[who].push({ t: t + dur * 0.5, x, y: p.y, s: p.s });
      };
      // Keel over sideways (deg > 0 falls to the right), and get back up.
      // Faint: a stiff topple back, squashed flat, eyes shut.
      R.faint = (who, t, deg = -24) => {
        R.mood(who, t, "shock");
        R.lean(who, t + 0.15, deg, 0.6, "bounce.out");
        R.stretch(who, t + 0.15, 1.18, 0.72, 0.6, "bounce.out");
        R.set(who + "-lidL", t + 0.85, { attr: { d: "M-30,-2 A30,30 0 0 1 30,-2 A30,30 0 0 1 -30,-2 Z" } });
        R.set(who + "-lidR", t + 0.85, { attr: { d: "M-30,-2 A30,30 0 0 1 30,-2 A30,30 0 0 1 -30,-2 Z" } });
      };
      R.getUp = (who, t, mood = "sleepy") => {
        R.lean(who, t, 0, 0.45, "back.out(1.6)");
        R.stretch(who, t, 1, 1, 0.45, "back.out(1.6)");
        R.mood(who, t + 0.2, mood);
      };
    
      // ---------- finish: breath, blinks, lip-sync, looks, bubbles, line boil ----------
      R.finish = () => {
        const cast = Object.keys(R.pos);
        cast.forEach((who, ci) => {
          const r = rng(1000 + ci * 77 + P.length * 13);
          // Idle breath, each character on its own period and phase.
          const per = 2.1 + r() * 0.9;
          const n = Math.max(1, Math.floor(R.D / (per / 2)));
          tl.fromTo($(who + "-br"), { scaleY: 1, scaleX: 1, svgOrigin: "0 0" },
            { scaleY: 1.03, scaleX: 0.99, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n - 1, svgOrigin: "0 0" }, r() * 0.4);
          // Blinks every 2-4 s.
          if (!R.blinkOff[who]) for (let t = 0.6 + r() * 1.5; t < R.D - 0.3; t += 2 + r() * 2.2) R.blink(who, t);
        });
        // Lip-sync from the voice envelope (15 levels a second) and eyes on the speaker.
        R.L.forEach((ln) => {
          if (!R.pos[ln.who]) return;
          let last = null;
          ln.mouth.forEach((lv, k) => {
            const t = ln.start + k / 15;
            const shape = lv === 0 ? MOODS[moodAt(ln.who, t)][1] : lv === 1 ? "o" : ln.yell ? "yell" : "open";
            if (shape !== last) R.mouth(ln.who, clampT(t), shape);
            last = shape;
          });
          R.mouth(ln.who, clampT(ln.end + 0.02), MOODS[moodAt(ln.who, ln.end + 0.02)][1]);
          R.squash(ln.who, Math.max(0, ln.start - 0.05), 1.04, 0.96, 0.08);
          const sp = posAt(ln.who, ln.start);
          cast.forEach((o) => {
            if (o === ln.who) return;
            const busy = (R.looks[o] || []).some(([a, b]) => ln.start + 0.1 < b && ln.start + 0.1 >= a - 0.2);
            if (busy) return;
            const op = posAt(o, ln.start);
            const dx = Math.sign(sp.x - op.x) * 7;
            tl.to([$(o + "-pupL"), $(o + "-pupR")], { x: dx, y: -3, duration: 0.14, ease: "power2.out" }, ln.start + 0.1);
          });
        });
        // Speech bubbles, placed over the speaker's head as framed by the camera at that moment.
        R.L.forEach((ln) => {
          const b = $("b" + ln.i);
          if (!b) return;
          const inner = b.firstElementChild, tail = b.querySelector(".tail");
          const w = Math.min(820, inner.offsetWidth), h = inner.offsetHeight;
          let sx, sy;
          if (R.pos[ln.who]) {
            const p = posAt(ln.who, ln.start);
            const head = RIG_DATA.CAST[ln.who].headTop * p.s;
            [sx, sy] = R.toScreen(p.x, p.y + head, ln.start);
          } else {
            sx = W - 20; sy = H * 0.4; // off screen to the right: Mummy at the door
          }
          // Above the head; in wide, when there is no room above, beside the head instead.
          const top0 = WIDE ? 40 : 190, mx = WIDE ? 100 : 80;
          let bottom = Math.max(top0 + h, Math.min(H - (WIDE ? 80 : 620), sy - 40));
          let left = Math.max(mx, Math.min(W - mx - w, sx - w / 2));
          if (WIDE && sy - 40 - h < top0 && R.pos[ln.who]) {
            bottom = Math.min(H - 80, Math.max(top0 + h, sy + h * 0.6));
            left = sx > W / 2 ? Math.max(mx, sx - 110 - w) : Math.min(W - mx - w, sx + 110);
          }
          b.style.left = left + "px";
          b.style.top = bottom - h + "px";
          tail.style.left = Math.max(46, Math.min(w - 46, sx - left)) + "px";
          tl.fromTo(inner, { scale: 0.4, opacity: 0, transformOrigin: `${Math.max(46, Math.min(w - 46, sx - left))}px 100%` },
            { scale: 1, opacity: 1, duration: 0.26, ease: "back.out(2.2)" }, Math.max(0, ln.start - 0.06));
          const out = Math.min(R.D - 0.02, ln.end + ln.hold) - 0.14;
          tl.to(inner, { scale: 0.85, opacity: 0, duration: 0.12, ease: "power2.in" }, out);
        });
        // Hand-drawn line boil: re-seed the wobble filter 12 times a second.
        const turb = $("turb");
        for (let k = 0; k < Math.ceil(R.D * 12); k++) tl.set(turb, { attr: { seed: (k % 6) + 1 } }, k / 12);
      };
      return R;
    }
    
    const build = () => {
      const tl = gsap.timeline({ paused: true });
      const R = makeRig("s6", tl);
      R.lightAt0(true);
      R.place("aloo", 260, 1186, 1, false);
      R.place("tamatar", 640, 1186, 1, false);
      R.place("bhindi", 860, 1186, 1, false);
      R.place("mirchi", 470, 1186, 0.9, false);
      const helpers = (R) => {
    R.wide = (t, dur = 0, ease) => R.cam(t, 1.16, 562, 985, dur, ease);
    R.lookAll = (t, dx, dy, hold = 1.5, who = ["aloo", "tamatar", "bhindi"]) =>
      who.forEach((w, i) => R.pos[w] && R.look(w, t + i * 0.06, dx, dy, hold));
    // Bhindi holds the torch in her left hand and points it.
    R.hold = (t, tx, ty, r = 150, dur = 0.45, ease = "power2.inOut") => {
      const [gx, gy] = R.handPos("bhindi", "L", 70);
      R.aim(t, gx, gy, tx, ty, r, dur, ease);
    };
    R.handAt = (t, x, y) => R.set("hand", t, { x, y, opacity: 1 });
    R.handTo = (t, x, y, dur = 0.5, ease = "power3.out") => R.to("hand", t, { x, y, duration: dur, ease });
  };
      helpers(R);
      const act = (R, L) => {
        R.blackoutAt0();
        R.torchOn(0, true);
        R.beamOn(0, true);
        R.aim(0, 800, 1168, 470, 1060, 170, 0);
        R.wide(0);
        R.mood("mirchi", 0, "happy", false);
        R.mood("aloo", 0, "sleepy", false);
        R.mood("bhindi", L[0].start, "happy");
        R.arm("bhindi", "L", L[0].start + 0.2, 90, 0.3);
        R.mood("mirchi", L[1].start - 0.1, "shock");
        R.hop("mirchi", L[1].start, { h: 110, dur: 0.5 });
        R.mood("mirchi", L[1].end + 0.1, "happy");
        R.arm("bhindi", "L", L[1].end, 0, 0.3);
        R.arm("aloo", "R", L[2].start + 0.2, 90, 0.3);
        R.arm("aloo", "R", L[2].end, 0, 0.3);
        // Power's back. The night light sputters on and the cold comes back.
        const tP = L[2].end + 0.5;
        R.blackout(tP, false);
        R.beamOn(tP + 0.5, false);
        R.lookAll(tP + 0.1, 0, -9, 1.2, ["aloo", "tamatar", "bhindi", "mirchi"]);
        ["tamatar", "bhindi", "mirchi", "aloo"].forEach((w, i) => {
          R.mood(w, L[3].start - 0.1 + i * 0.05, "happy");
          R.arms(w, L[3].start + i * 0.06, 160, 160, 0.25);
          R.hop(w, L[3].start + 0.05 + i * 0.08, { h: w === "aloo" ? 40 : 110, dur: 0.5 });
        });
      };
      act(R, SHOT.lines);
      R.finish();
      window.__timelines = window.__timelines || {};
      window.__timelines["s6"] = tl;
    };
    document.fonts.ready.then(build);
  })();
  </script>
</template>
