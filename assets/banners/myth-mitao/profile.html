<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{width:800px;height:800px;background:#F6E6C4;overflow:hidden}</style></head><body>
<svg width="800" height="800" viewBox="0 0 800 800">
 <defs>
  <linearGradient id="split" x1="0" x2="1"><stop offset=".5" stop-color="#F7B85A"/><stop offset=".5" stop-color="#8CCBE3"/></linearGradient>
  <linearGradient id="warm" x1="0" x2="1"><stop offset="0" stop-color="#F29A3A"/><stop offset="1" stop-color="#FBD38A"/></linearGradient>
  <linearGradient id="cool" x1="0" x2="1"><stop offset="0" stop-color="#BFE4F1"/><stop offset="1" stop-color="#5FAFD3"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2F7FA3" stroke-width="2" opacity=".3"/></pattern>
  <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A2E20"/><stop offset="1" stop-color="#6A1B12"/></linearGradient>
 </defs>
 <rect width="400" height="800" fill="url(#warm)"/>
 <rect x="400" width="400" height="800" fill="url(#cool)"/>
 <rect x="400" width="400" height="800" fill="url(#grid)"/>
 <g id="rays" transform="translate(400,400)"></g>

 <!-- TOP: lota (left) vs flask (right) with ? between -->
 <g transform="translate(250,215)">
  <ellipse cx="0" cy="0" rx="95" ry="95" fill="#FFE7B0" opacity=".35"/>
  <path d="M-40 -80 h80 l-9 22 q62 30 62 100 q0 70 -93 74 q-93 -4 -93 -74 q0 -70 62 -100z" fill="#C8693A" stroke="#2A0D08" stroke-width="9" stroke-linejoin="round"/>
  <path d="M-50 -92 h100 v16 h-100z" fill="#D9824D" stroke="#2A0D08" stroke-width="8"/>
  <text x="0" y="62" text-anchor="middle" font-family="Yatra One" font-size="74" fill="#F6C453" stroke="#2A0D08" stroke-width="3">ॐ</text>
  <path d="M-58 0 q-10 40 0 70" fill="none" stroke="#F4B07C" stroke-width="10" stroke-linecap="round"/>
 </g>
 <g transform="translate(550,215)">
  <ellipse cx="0" cy="0" rx="95" ry="95" fill="#FFFFFF" opacity=".35"/>
  <path d="M-22 -90 v60 l-66 120 q-6 18 14 18 h148 q20 0 14 -18 l-66 -120 v-60z" fill="#EAF6FB" stroke="#2A0D08" stroke-width="9" stroke-linejoin="round"/>
  <path d="M-56 30 l-32 60 q-6 18 14 18 h148 q20 0 14 -18 l-32 -60z" fill="#3FB5A5" stroke="#2A0D08" stroke-width="8" stroke-linejoin="round"/>
  <path d="M-34 -96 h68 v14 h-68z" fill="#2A0D08"/>
  <circle cx="-10" cy="70" r="11" fill="#BFF0E8"/><circle cx="22" cy="58" r="7" fill="#BFF0E8"/>
  <circle cx="4" cy="0" r="9" fill="none" stroke="#3FB5A5" stroke-width="5"/><circle cx="-6" cy="-40" r="6" fill="none" stroke="#3FB5A5" stroke-width="4"/>
 </g>
 <text x="400" y="230" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="120" fill="#FFF6E2" stroke="#2A0D08" stroke-width="8" paint-order="stroke">?</text>

 <!-- MIDDLE: the name sign -->
 <g transform="rotate(-5 400 420)">
  <rect x="90" y="318" width="620" height="210" rx="26" fill="#2A0D08" transform="translate(0,12)" opacity=".35"/>
  <rect x="90" y="318" width="620" height="210" rx="26" fill="url(#sign)" stroke="#2A0D08" stroke-width="12"/>
  <rect x="108" y="336" width="584" height="174" rx="16" fill="none" stroke="#F6C453" stroke-width="6"/>
  <text x="400" y="422" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="106" letter-spacing="4" fill="#FFE7B0" stroke="#2A0D08" stroke-width="10" paint-order="stroke">MYTH</text>
  <text x="400" y="500" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="78" letter-spacing="10" fill="#F6C453" stroke="#2A0D08" stroke-width="8" paint-order="stroke">MITAO</text>
  <!-- sparkle accents -->
  <path d="M686 312 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" fill="#FFF6E2" stroke="#2A0D08" stroke-width="4"/>
  <path d="M112 520 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#FFF6E2" stroke="#2A0D08" stroke-width="4"/>
 </g>

 <!-- BOTTOM: Hindi name pill -->
 <rect x="230" y="578" width="340" height="96" rx="48" fill="#FFF6E2" stroke="#2A0D08" stroke-width="9"/>
 <text x="400" y="645" text-anchor="middle" font-family="Yatra One" font-size="58" fill="#8E2A1E">मिथ मिटाओ</text>

 <!-- ring -->
 <circle cx="400" cy="400" r="392" fill="none" stroke="#2A0D08" stroke-width="20"/>
 <circle cx="400" cy="400" r="375" fill="none" stroke="#F6C453" stroke-width="10"/>
</svg>
<script>
const r=document.getElementById('rays');
for(let i=0;i<24;i++){const a=i*15*Math.PI/180,b=(i*15+7.5)*Math.PI/180,L=700;
 r.insertAdjacentHTML('beforeend',`<path d="M0 0 L${L*Math.cos(a)} ${L*Math.sin(a)} L${L*Math.cos(b)} ${L*Math.sin(b)}z" fill="#FFFFFF" opacity=".12"/>`);}
</script></body></html>
