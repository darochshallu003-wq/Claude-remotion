<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Yatra+One&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2560px;height:1440px;overflow:hidden;background:#F3E3C3}
#b{position:relative;width:2560px;height:1440px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 50%,#FBF1DC 0%,#F3E1BC 45%,#E6C893 100%)}
svg.full{position:absolute;inset:0}
.safe{position:absolute;left:507px;top:509px;width:1546px;height:423px}
.sign{position:absolute;left:350px;top:30px;width:840px;height:250px;
 background:linear-gradient(#8E2A1E,#6E1D14);border:10px solid #3A120C;border-radius:22px;
 box-shadow:0 0 0 6px #D9A441 inset,0 14px 0 #3A120C33;display:flex;flex-direction:column;align-items:center;justify-content:center}
.en{font-family:Poppins;font-weight:800;font-size:112px;color:#FFE7B0;letter-spacing:2px;line-height:1;text-shadow:0 6px 0 #3A120C}
.hi{font-family:'Yatra One';font-size:64px;color:#F6C453;line-height:1.1;margin-top:8px}
.tag{position:absolute;left:300px;top:298px;width:940px;text-align:center;font-family:'Tiro Devanagari Hindi';font-size:48px;color:#3A120C;line-height:1.2}
.tag b{color:#8E2A1E;font-weight:400}
.handle{position:absolute;left:300px;top:370px;width:940px;text-align:center;font-family:Poppins;font-weight:600;font-size:30px;color:#6E1D14;letter-spacing:6px}
.rope{position:absolute;top:-509px;width:6px;height:545px;background:#3A120C}
</style></head><body><div id="b">
<svg class="full" viewBox="0 0 2560 1440">
 <defs>
  <pattern id="tile" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M0 80 L80 0" stroke="#C9A36A" stroke-width="1.5" opacity=".35"/><path d="M0 0 L80 80" stroke="#C9A36A" stroke-width="1.5" opacity=".35"/></pattern>
 </defs>
 <!-- sun rays -->
 <g transform="translate(1280,720)" opacity=".5">
  <script>/*rays generated below*/</script>
 </g>
 <g id="rays" transform="translate(1280,720)"></g>
 <!-- floor -->
 <rect x="0" y="1120" width="2560" height="320" fill="#E2C391"/>
 <rect x="0" y="1120" width="2560" height="320" fill="url(#tile)"/>
 <line x1="0" y1="1120" x2="2560" y2="1120" stroke="#3A120C" stroke-width="6"/>
 <!-- temple silhouettes far left/right -->
 <g fill="#C79B5E" opacity=".55">
  <path d="M40 1120 V760 h40 l70 -200 l70 200 h40 V1120z"/><circle cx="150" cy="545" r="16"/>
  <path d="M2260 1120 V720 h50 l90 -240 l90 240 h50 V1120z"/><circle cx="2400" cy="462" r="18"/>
 </g>
 <!-- toran (marigold strings) along top -->
 <g id="toran"></g>
 <!-- diyas on floor -->
 <g id="diyas"></g>
</svg>

<div class="safe">
 <!-- character left -->
 <svg style="position:absolute;left:10px;top:8px" width="290" height="404" viewBox="0 0 330 460">
  <ellipse cx="165" cy="448" rx="110" ry="12" fill="#3A120C" opacity=".2"/>
  <!-- bow -->
  <path d="M265 60 Q330 230 265 410" fill="none" stroke="#6E3B12" stroke-width="10" stroke-linecap="round"/>
  <line x1="265" y1="60" x2="265" y2="410" stroke="#3A120C" stroke-width="2.5"/>
  <!-- legs / dhoti -->
  <path d="M110 280 h110 l12 150 h-55 l-12 -110 l-12 110 h-55z" fill="#E8B23A" stroke="#3A120C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M125 300 v120 M205 300 v120" stroke="#C78A1E" stroke-width="4"/>
  <!-- body -->
  <path d="M110 160 q55 -20 110 0 l10 125 h-130z" fill="#4E7FC4" stroke="#3A120C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M120 165 L215 285" stroke="#D9A441" stroke-width="7"/>
  <rect x="104" y="270" width="122" height="16" rx="6" fill="#8E2A1E" stroke="#3A120C" stroke-width="4"/>
  <!-- arms -->
  <path d="M112 168 q-30 50 -22 120" fill="none" stroke="#4E7FC4" stroke-width="24" stroke-linecap="round"/>
  <path d="M112 168 q-30 50 -22 120" fill="none" stroke="#3A120C" stroke-width="30" stroke-linecap="round" opacity="0"/>
  <path d="M218 168 q35 40 45 95" fill="none" stroke="#4E7FC4" stroke-width="24" stroke-linecap="round"/>
  <circle cx="263" cy="262" r="15" fill="#4E7FC4" stroke="#3A120C" stroke-width="4"/>
  <!-- neck + head -->
  <rect x="150" y="135" width="30" height="30" fill="#4E7FC4"/>
  <ellipse cx="165" cy="105" rx="50" ry="56" fill="#5B8FD6" stroke="#3A120C" stroke-width="5"/>
  <!-- crown -->
  <path d="M118 70 l8 -50 l18 26 l21 -40 l21 40 l18 -26 l8 50z" fill="#F2C14E" stroke="#3A120C" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="165" cy="48" r="7" fill="#C0392B"/>
  <!-- face -->
  <path d="M140 100 q10 -8 20 0 M170 100 q10 -8 20 0" fill="none" stroke="#3A120C" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 128 q15 10 30 0" fill="none" stroke="#3A120C" stroke-width="4" stroke-linecap="round"/>
  <path d="M165 72 v14" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
  <!-- necklace -->
  <path d="M135 165 q30 30 60 0" fill="none" stroke="#F2C14E" stroke-width="6"/>
 </svg>

 <!-- sign with ropes -->
 <div class="rope" style="left:470px"></div><div class="rope" style="left:1064px"></div>
 <div class="sign"><div class="en">Myth Mitao</div><div class="hi">मिथ मिटाओ</div></div>
 <div class="tag">हर पौराणिक <b>“क्यों?”</b> का जवाब — <b>30 सेकंड में</b></div>
 <div class="handle">@MYTHMITAO · NEW SHORTS DAILY</div>

 <!-- question bubble right -->
 <svg style="position:absolute;right:10px;top:40px" width="270" height="320" viewBox="0 0 320 380">
  <path d="M160 20 C255 20 300 80 300 150 C300 225 245 275 165 278 L120 340 L125 274 C60 262 20 215 20 150 C20 80 70 20 160 20z" fill="#FFF6E2" stroke="#3A120C" stroke-width="7" stroke-linejoin="round"/>
  <text x="160" y="220" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="190" fill="#8E2A1E">?</text>
  <text x="250" y="80" font-size="40" fill="#D9A441" font-family="Poppins" font-weight="800">✦</text>
 </svg>
</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const r=document.getElementById('rays');
for(let i=0;i<36;i++){const a=i*10*Math.PI/180,b=(i*10+5)*Math.PI/180,L=2000;
 const p=document.createElementNS(NS,'path');
 p.setAttribute('d',`M0 0 L${L*Math.cos(a)} ${L*Math.sin(a)} L${L*Math.cos(b)} ${L*Math.sin(b)}z`);
 p.setAttribute('fill',i%2?'#E9CD98':'#F7E6C2');p.setAttribute('opacity','.55');r.appendChild(p);}
const t=document.getElementById('toran');
for(let x=0;x<=2560;x+=320){ // scalloped strings
 const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x} 0 Q${x+160} 150 ${x+320} 0`);
 p.setAttribute('fill','none');p.setAttribute('stroke','#2E6B2E');p.setAttribute('stroke-width','5');t.appendChild(p);
 for(let k=1;k<8;k++){const u=k/8,px=x+320*u,py=2*(1-u)*u*150;
  const c=document.createElementNS(NS,'circle');c.setAttribute('cx',px);c.setAttribute('cy',py+12);c.setAttribute('r',14);
  c.setAttribute('fill',k%2?'#F28C1E':'#F6C453');c.setAttribute('stroke','#8A4A0E');c.setAttribute('stroke-width','3');t.appendChild(c);
  const lf=document.createElementNS(NS,'ellipse');lf.setAttribute('cx',px);lf.setAttribute('cy',py+34);lf.setAttribute('rx',6);lf.setAttribute('ry',12);lf.setAttribute('fill','#2E6B2E');t.appendChild(lf);}}
const d=document.getElementById('diyas');
[200,420,640,1920,2140,2360].forEach(x=>{
 d.insertAdjacentHTML('beforeend',`<g transform="translate(${x},1185)">
 <ellipse cx="0" cy="-58" rx="40" ry="55" fill="#FFD36B" opacity=".35"/>
 <path d="M0 -70 C14 -50 12 -32 0 -26 C-12 -32 -14 -50 0 -70z" fill="#F28C1E"/>
 <path d="M0 -58 C6 -48 5 -38 0 -34 C-5 -38 -6 -48 0 -58z" fill="#FFE27A"/>
 <path d="M-50 -24 h100 q-10 40 -50 40 q-40 0 -50 -40z" fill="#B5541B" stroke="#3A120C" stroke-width="5" stroke-linejoin="round"/></g>`);});
</script></body></html>
